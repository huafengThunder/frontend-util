# ==========================================
# 原有的 www.huafeng.ink / huafeng.ink 配置
# ==========================================
server {
    server_name www.huafeng.ink huafeng.ink;

    location / {
        root   /usr/local/frontend-util/dist/;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
    location /feutil {
        proxy_pass http://localhost:3001/feutil;
    }

    error_page 404 /404.html;
    location = /404.html {
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/www.huafeng.ink/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.huafeng.ink/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

# HTTP 跳转 HTTPS（www 和 huafeng.ink）
server {
    if ($host = huafeng.ink) {
        return 301 https://$host$request_uri;
    }
    if ($host = www.huafeng.ink) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name www.huafeng.ink huafeng.ink;
    return 404; # managed by Certbot




}

# ==========================================
# 🆕 新增：insite.huafeng.ink 转发给 888 端口
# ==========================================
server {
    listen 443 ssl;
    server_name insite.huafeng.ink;
    ssl_certificate /etc/letsencrypt/live/www.huafeng.ink/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.huafeng.ink/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

}

server {
    if ($host = insite.huafeng.ink) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name insite.huafeng.ink;
    return 301 https://$server_name$request_uri;


}